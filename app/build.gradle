plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

android {
    compileSdk 35
    namespace 'com.redgecko.expensetracker'

    defaultConfig {
        applicationId "com.redgecko.expensetracker"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.2.0"
        // when update version, don't forget change the application class and @string/app_splash_name
        multiDexEnabled true

        vectorDrawables.useSupportLibrary true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        // Enables Jetpack Compose for this module
        compose true
        viewBinding false
        dataBinding false
        buildConfig true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.java.excludes += ['**/*.disabled', '**/*.unused', '**/*.old', '**/*.temp']
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11'
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    
    // View Binding is enabled, no kapt needed
    
    lint {
        abortOnError false
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation "androidx.multidex:multidex:2.0.1"

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // AndroidX dependencies
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Room database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Retrofit for networking (if needed)
    // implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    // implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // date range picker
    implementation 'com.wdullaer:materialdatetimepicker:2.1.1'

    // floating action button
    implementation 'com.melnykov:floatingactionbutton:1.3.0'

    // the viewpager shown first time to use ExpenseTracker
    implementation files('../libs/scviewpager-0.0.4.aar')

    // image slider
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.daimajia.slider:library:1.1.5@aar'

    // expandable layout
    implementation files('../libs/expandable-layout-v1.6.0.aar')

    // charts
    implementation 'com.github.lecho:hellocharts-library:1.5.8@aar'

    // snack bar
    implementation 'com.nispok:snackbar:2.11.+'

    // icons
    implementation 'com.github.code-mc:material-icon-lib:1.1.5'

    // toasts
    implementation 'com.github.johnpersano:supertoasts:1.3.4.1@aar'

    // memory leak
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.6.3'
//    releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.6.3'

    // swipe recyclerview
    implementation('com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:0.8.4@aar'){
        transitive=true
    }

    // circle image view
    implementation 'de.hdodenhof:circleimageview:2.0.0'

    // search bar
    implementation group: 'io.gitlab.alexto9090', name: 'materialsearchview', version: '1.0.0'

    // the little check and X
    implementation 'com.wnafee:vector-compat:1.0.5'

    // fast scroller
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'

    // dialogs
    implementation('com.github.afollestad.material-dialogs:commons:0.9.6.0@aar') {
        transitive = true
    }

    // the radio check circle
    implementation 'com.github.rey5137:material:1.2.1'

    // bmob
    implementation files('../libs/bmob-sdk-3.4.5.jar')

    implementation 'com.squareup.okhttp:okhttp:2.7.5'
    implementation 'com.squareup.okhttp:okhttp-urlconnection:2.7.5'
    implementation 'com.squareup.okio:okio:1.4.0'

    // logo
    implementation 'com.koushikdutta.ion:ion:2.+'

    // bugly
    //compile 'com.tencent.bugly:crashreport:1.2.8'

    // splash activity
    implementation('com.github.ozodrukh:CircularReveal:1.3.1@aar') {
        transitive = true;
    }

    implementation 'com.jakewharton.timber:timber:5.0.1'

    // MaterialViewPager dependencies - why so many libraries in this app?
    implementation 'com.flaviofaria:kenburnsview:1.0.7'
    implementation 'com.github.ksoichiro:android-observablescrollview:1.5.2'
    implementation 'com.jpardogo.materialtabstrip:library:1.1.1'

    // Integration with activities
    implementation 'androidx.activity:activity-compose:1.8.2'
    // Compose Material Design
    implementation "androidx.compose.material:material:$compose_version"
    // Animations
    implementation "androidx.compose.animation:animation:$compose_version"
    // Tooling support (Previews, etc.)
    implementation "androidx.compose.ui:ui-tooling:$compose_version"

    implementation "androidx.compose.foundation:foundation:$compose_version"
    implementation "androidx.compose.foundation:foundation-layout:$compose_version"
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.material3:material3-window-size-class:1.1.2'
    implementation 'androidx.compose.ui:ui-text-google-fonts:1.4.3'

    // Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    // Navigation Compose
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    // UI Tests
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"

    //Dagger - Hilt
    implementation 'com.google.dagger:hilt-android:2.50'
    ksp 'com.google.dagger:hilt-compiler:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
}

